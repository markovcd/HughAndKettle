# The gate on every push to main and every pull request. It runs gate.sh, which builds the gate
# container; the job needs Docker and nothing else, holds no secrets and can write nothing. A newer
# push to the same branch cancels an older run.
name: Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./gate.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate
          path: |
            build/gate-artifacts
            build/gate.log
          if-no-files-found: ignore
          retention-days: 7
