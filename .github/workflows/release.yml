# A release, by hand: dispatch it with a version (or none for the next patch) and release.sh does the
# rest: the gate on that commit, signing, the changelog commit, the tag and the GitHub release. The
# keys reach only the jobs that sign, as secrets. The msix job builds and signs the Windows package on a
# Windows runner, since jpackage cannot cross-build, and the release job checks it built the same commit.
# A release is never cancelled once started.
name: Release
run-name: Release ${{ inputs.version || 'next patch' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z; empty for the next patch after the latest tag"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - id: version
        shell: bash
        run: |
          echo "version=$(./release.sh "$VERSION" --print-version)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
      - run: ./gradlew.bat :desktop:createDistributable --no-daemon --console=plain
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ steps.version.outputs.version }}
      - name: The certificate from secrets, into a file the job deletes with its workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$MSIX_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/keys/msix.pfx"
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
      - run: desktop/packaging/msix.ps1 -Version ${{ steps.version.outputs.version }} -Out build/msix/hughandkettle.msix -Pfx $env:RUNNER_TEMP/keys/msix.pfx
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix
          path: build/msix/hughandkettle.msix
          retention-days: 1

  release:
    needs: msix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: The MSIX was built from this commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.msix.outputs.commit }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix
          path: ${{ runner.temp }}/msix
      - name: Keys from secrets, into files the script reads and the job deletes with its workspace
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$RUNNER_TEMP/keys/release_ssh_key"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          echo "RELEASE_SSH_KEY_FILE=$RUNNER_TEMP/keys/release_ssh_key" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./release.sh "${{ inputs.version }}" --publish
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MSIX_FILE: ${{ runner.temp }}/msix/hughandkettle.msix
          GH_TOKEN: ${{ github.token }}
