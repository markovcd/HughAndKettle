# Dependabot says when a pin should move: the Gradle catalog and lock files, the action SHAs, and the
# gate image's digest. A session takes a cheap upgrade in a commit of its own (the dependencies skill).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image's JDK is the build's toolchain (`jdk` in gradle/libs.versions.toml); a new major is a
      # retarget, taken by hand in its own commit.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
