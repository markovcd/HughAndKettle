# One place for every version. Dependabot proposes moves; a session takes a cheap
# one in a commit of its own (the dependencies skill).
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coroutines = "1.11.0"
# Read and written through its JsonElement tree, so no compiler plugin is needed.
serialization = "1.11.0"
junit = "6.1.3"
# Android unit tests run on JUnit 4; the JVM modules on JUnit 5.
junit4 = "4.13.2"
ktlintPlugin = "14.2.0"
ktlint = "1.8.0"
composeBom = "2026.09.00"
# JetBrains' Compose for the `ui` and `desktop` modules; on Android it resolves to the androidx artifacts.
composeMultiplatform = "1.12.2"
composeMultiplatformMaterial3 = "1.9.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
robolectric = "4.17"
# The Android framework Robolectric runs the app's tests on, fetched by Gradle and locked rather than
# downloaded by Robolectric at test time. Its SDK level is the one in the app's robolectric.properties.
robolectricAndroidAll = "17-robolectric-15733970-i7"
# Compose's test library brings Espresso 3.5, which cannot inject input on SDK 37; named to lift it.
espresso = "3.7.0"
# Toolchain: one JDK for build-logic, the JVM modules and the app.
jdk = "21"
compileSdk = "37"
minSdk = "26"
targetSdk = "37"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-mp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-mp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-mp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-mp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
compose-mp-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-mp-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
# Gradle plugins, as libraries, for build-logic's own classpath.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-mp-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintPlugin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
